<!-- 1. PROCEDURAL SHADER BACKGROUND ASSET -->
<div class="fixed inset-0 w-full h-full -z-10 pointer-events-none" style="display:block;">
<canvas id="shader-canvas-BACKGROUND" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-BACKGROUND');

  function syncSize() {
    const w = canvas.clientWidth  || window.innerWidth || 1280;
    const h = canvas.clientHeight || window.innerHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;
varying vec2 v_texCoord;

vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }

float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i  = floor(v + dot(v, C.yy) );
  vec2 x0 = v -   i + dot(i, C.xx);
  vec2 i1  = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod289(i);
  vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
  vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
  m = m*m ;
  m = m*m ;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
  vec3 g;
  g.x  = a0.x  * x0.x  + h.x  * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

void main() {
    vec2 st = gl_FragCoord.xy / u_resolution.xy;
    vec2 mouseNorm = u_mouse / u_resolution;
    float aspect = u_resolution.x / u_resolution.y;
    vec2 p = st;
    p.x *= aspect;

    float t = u_time * 0.16;
    
    float n1 = snoise(vec2(p.x * 1.1 + t * 0.4, p.y * 1.1 - t * 0.25));
    float n2 = snoise(vec2(p.x * 1.8 - t * 0.35 + n1 * 0.5, p.y * 1.8 + t * 0.18));
    
    vec2 mPos = mouseNorm;
    mPos.x *= aspect;
    float mDist = length(p - mPos);
    float mInfluence = smoothstep(0.8, 0.0, mDist) * 0.3;

    // Palette: soft lilac / lavender, ethereal ice cyan, gentle rose/peach mist
    vec3 cLavender = vec3(0.80, 0.81, 0.96);
    vec3 cIceBlue  = vec3(0.82, 0.92, 0.95);
    vec3 cPeach    = vec3(0.98, 0.85, 0.90);
    vec3 cMist     = vec3(0.94, 0.93, 0.98);

    float blend1 = smoothstep(0.1, 0.9, st.x + n1 * 0.25 + mInfluence * 0.15);
    float blend2 = smoothstep(0.0, 1.0, st.y + n2 * 0.2);

    vec3 col = mix(cLavender, cIceBlue, blend1);
    col = mix(col, cPeach, blend2 * 0.55 + n1 * 0.12);
    col = mix(col, cMist, (1.0 - st.y) * 0.35);

    // Subtle film grain
    float grain = fract(sin(dot(gl_FragCoord.xy + u_time * 12.0, vec2(12.9898,78.233))) * 43758.5453) * 0.02;
    col += grain;

    gl_FragColor = vec4(col, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<!-- BEGIN: InteractiveHandlers -->
<script data-purpose="client-interactions">
    // Fill textarea with clicked prompt suggestion
    function setPrompt(text) {
      const textarea = document.getElementById('prompt-input');
      textarea.value = text.trim();
      textarea.focus();
    }

    // Toggle active state for Image / Video / Text media modes
    function switchTab(clickedBtn, type) {
      const allButtons = document.querySelectorAll('.tab-btn');
      allButtons.forEach(btn => {
        btn.className = "tab-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-mono font-medium text-black/60 hover:text-black transition-colors";
      });

      // Highlight active button with high-contrast jet black aesthetic
      clickedBtn.className = "tab-btn flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-xs font-mono font-semibold bg-black text-white shadow-sm transition-all";
      
      const textarea = document.getElementById('prompt-input');
      if (type === 'image') {
        textarea.placeholder = "Describe the image you want to generate...";
      } else if (type === 'video') {
        textarea.placeholder = "Describe the video scene you want to produce...";
      } else {
        textarea.placeholder = "Describe what you want to create...";
      }
    }

    // Interactive Shuffle action for suggestion pills
    const samplePrompts = [
      [
        "Draft a polite complaint letter to a noisy neighbor",
        "Write a product description for wireless headphones",
        "Write a motivational speech for a graduation"
      ],
      [
        "Create a cold outreach email template for B2B sales",
        "Summarize the key differences between SQL and NoSQL",
        "Generate a 7-day high protein vegetarian meal plan"
      ],
      [
        "Draft an elevator pitch for an AI productivity startup",
        "Write a sci-fi micro story set on a desert planet",
        "Compose a thoughtful thank you note to a mentor"
      ]
    ];

    let currentPromptSet = 0;
    const shuffleBtn = document.getElementById('btn-shuffle');
    if (shuffleBtn) {
      shuffleBtn.addEventListener('click', () => {
        currentPromptSet = (currentPromptSet + 1) % samplePrompts.length;
        const container = document.getElementById('suggestions-container');
        container.innerHTML = samplePrompts[currentPromptSet].map(p => `
          <button type="button" onclick="setPrompt(this.innerText)" class="px-5 py-2.5 rounded-full text-xs sm:text-[13px] text-[#111317]/85 glass-pill hover:bg-white hover:text-black hover:shadow-md transition-all max-w-[90%] truncate shadow-sm font-sans">
            ${p}
          </button>
        `).join('');
      });
    }

    // Dynamic submit button feedback
    const createBtn = document.getElementById('btn-create');
    const promptInput = document.getElementById('prompt-input');

    promptInput.addEventListener('input', () => {
      if (promptInput.value.trim().length > 0) {
        createBtn.classList.remove('bg-black');
        createBtn.classList.add('bg-[#5120e6]', 'hover:bg-[#4510d0]');
      } else {
        createBtn.classList.remove('bg-[#5120e6]', 'hover:bg-[#4510d0]');
        createBtn.classList.add('bg-black');
      }
    });
  </script>
<!-- END: InteractiveHandlers -->
