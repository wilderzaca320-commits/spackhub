<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sparkhub - Create Account</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter & Space Grotesk -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            spark: {
              charcoal: '#111317',
              muted: '#68707D',
              border: '#E8ECF2',
              surface: '#FFFFFF',
              lavender: '#F5F3FF',
              emerald: '#059669',
              primary: '#6366F1'
            }
          }
        }
      }
    }
  </script>
<!-- Custom styles for subtle ethereal glows and gradients -->
<style data-purpose="ethereal-theme">
    body {
      background-color: #FAF9FC;
      background-image: 
        radial-gradient(at 15% 15%, rgba(224, 231, 255, 0.6) 0px, transparent 50%),
        radial-gradient(at 85% 20%, rgba(245, 230, 255, 0.7) 0px, transparent 50%),
        radial-gradient(at 50% 80%, rgba(236, 253, 245, 0.4) 0px, transparent 60%);
      background-attachment: fixed;
    }
    .frosted-glass {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 45px -15px rgba(26, 38, 74, 0.07), 0 0 0 1px rgba(226, 232, 240, 0.6);
    }
    .card-selected-glow {
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.12), 0 0 0 2px #10B981;
    }
  </style>
</head>
<body class="min-h-screen text-spark-charcoal flex flex-col justify-between selection:bg-indigo-100 selection:text-indigo-900">
<!-- BEGIN: MainContent -->
<main class="flex-grow flex items-center justify-center px-4 py-8 md:py-12" data-purpose="registration-screen">
<div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">
<!-- BEGIN: LeftHeroArtwork -->
<!-- Displays the robot artwork cropped with branding as requested -->
<section class="lg:col-span-6 flex justify-center order-2 lg:order-1" data-purpose="robot-showcase-panel">
<div class="relative w-full max-w-[480px] rounded-3xl overflow-hidden shadow-2xl border border-white/60 bg-slate-950 group">
<!-- Ambient Glow under the card -->
<div class="absolute -inset-1 bg-gradient-to-r from-purple-500/20 to-teal-400/20 rounded-3xl blur-xl opacity-75 group-hover:opacity-100 transition duration-500"></div>
<div class="relative overflow-hidden rounded-3xl aspect-[1/1] w-full">
<!-- Exact source from user input: Left robot artwork panel from image -->
<img alt="Sparkhub AI Robot Avatar with Glowing Crystal Cube" class="w-full h-full object-cover object-left transform scale-[1.03] transition-transform duration-700 hover:scale-105" src="https://lh3.googleusercontent.com/aida-public/AB6AXuChaRjHuWy7iPSX7VnVa41ZjBIXsHX2O4TDzVh7d5dAbwaptt4F8zdGfmI04A1r9FGYPKaadB_PpVCYTvgw0_NXG8RMmd04ApmQRLM2mC8pv-Pr5KGOF_FFjV0m6r3JHYZLS9mPHUx0YsxFIDoTt1nx5hrncsgs1O8xa8Ht7Hh5UjwkQJFyJJyG523GynPynBoprUA0UzEXzPa2AEry--l1MbB_Wxd9iWSRwGXsGmh1oOM4oGGW4Rdl2w"/>
<!-- Soft ethereal gloss reflection overlay -->
<div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/5 to-white/20 pointer-events-none"></div>
</div>
</div>
</section>
<!-- END: LeftHeroArtwork -->
<!-- BEGIN: RegistrationFormCard -->
<section class="lg:col-span-6 flex flex-col justify-center order-1 lg:order-2" data-purpose="signup-flow-panel">
<div class="w-full max-w-[500px] mx-auto">
<!-- Header Area -->
<header class="mb-7 text-left">
<div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-indigo-50/80 border border-indigo-100 text-indigo-700 text-xs font-semibold mb-3 tracking-wide uppercase">
<span class="w-1.5 h-1.5 rounded-full bg-indigo-600 animate-pulse"></span>
              Onboarding
            </div>
<h1 class="text-3xl sm:text-4xl font-bold font-display tracking-tight text-slate-900">
              Create Account
            </h1>
<p class="text-spark-muted text-sm mt-1">Start your smart trading journey in minutes</p>
</header>
<!-- Main White / Ethereal Form Container -->
<div class="frosted-glass rounded-3xl p-6 sm:p-8">
<!-- Step & Label Heading -->
<div class="flex items-center justify-between pb-5 border-b border-slate-100">
<span class="text-sm font-semibold text-slate-800 uppercase tracking-wider">Account Type</span>
<span class="text-xs font-semibold text-slate-500 bg-slate-100/90 px-3 py-1 rounded-full border border-slate-200/80">
                Step 1 of 5
              </span>
</div>
<!-- Account Type Selection Options -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 my-6" data-purpose="selection-options" id="account-selection-container">
<!-- Option 1: Individual (Selected by default) -->
<button aria-pressed="true" class="account-card card-selected-glow bg-white relative flex flex-col items-center justify-center p-6 rounded-2xl border-2 border-emerald-500 text-center transition-all duration-200 cursor-pointer focus:outline-none hover:shadow-md group" data-purpose="account-type-option" id="type-individual" type="button">
<!-- Active badge indicator -->
<span class="absolute top-2.5 right-2.5 w-2 h-2 rounded-full bg-emerald-500 ring-4 ring-emerald-50"></span>
<!-- Icon container -->
<div class="w-12 h-12 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center mb-3 group-hover:scale-105 transition-transform">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<h3 class="font-bold text-slate-900 text-base mb-1">Individual</h3>
<p class="text-xs text-emerald-700 font-medium">Personal trading account</p>
</button>
<!-- Option 2: Corporate -->
<button aria-pressed="false" class="account-card bg-slate-50/60 hover:bg-white relative flex flex-col items-center justify-center p-6 rounded-2xl border border-slate-200/90 text-center transition-all duration-200 cursor-pointer focus:outline-none hover:border-slate-300 hover:shadow-sm group" data-purpose="account-type-option" id="type-corporate" type="button">
<!-- Icon container -->
<div class="w-12 h-12 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center mb-3 group-hover:scale-105 transition-transform">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<h3 class="font-bold text-slate-800 text-base mb-1">Corporate</h3>
<p class="text-xs text-slate-500 font-medium">Business trading account</p>
</button>
</div>
<!-- Submit & Flow Actions -->
<div class="space-y-4 pt-2">
<button class="w-full py-3.5 px-6 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-sm tracking-wide transition-all duration-200 shadow-lg shadow-slate-900/10 hover:shadow-slate-900/20 flex items-center justify-center gap-2 group" data-purpose="continue-button" type="button">
<span>Continue</span>
<svg class="w-4 h-4 transform group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Sign In Redirect -->
<p class="text-center text-xs sm:text-sm text-slate-500 pt-1">
                Already have an account? 
                <a class="font-semibold text-slate-900 hover:text-indigo-600 transition-colors underline underline-offset-4 decoration-slate-300 hover:decoration-indigo-600" href="#signin">
                  Sign In
                </a>
</p>
</div>
</div>
<!-- End Frosted Glass Card -->
</div>
</section>
<!-- END: RegistrationFormCard -->
</div>
</main>
<!-- END: MainContent -->
<!-- BEGIN: SiteFooter -->
<footer class="w-full border-t border-slate-200/80 bg-white/70 backdrop-blur-md py-4 px-6 relative z-10" data-purpose="site-footer">
<div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between text-xs text-slate-500 gap-3">
<!-- Copyright -->
<div class="order-2 md:order-1 text-center md:text-left font-normal">
        © 2026 Genesis FX Markets. All rights reserved.
      </div>
<!-- Legal Navigation -->
<nav class="order-1 md:order-2 flex flex-wrap justify-center items-center gap-x-5 gap-y-2 text-slate-600">
<a class="hover:text-slate-900 transition-colors" href="#terms">Terms &amp; Conditions</a>
<span class="text-slate-300 hidden sm:inline">•</span>
<a class="hover:text-slate-900 transition-colors" href="#privacy">Privacy Policy</a>
<span class="text-slate-300 hidden sm:inline">•</span>
<a class="hover:text-slate-900 transition-colors" href="#risk">Risk Disclosure</a>
<span class="text-slate-300 hidden sm:inline">•</span>
<a class="hover:text-slate-900 transition-colors" href="#aml">Anti-Money Laundering</a>
</nav>
</div>
</footer>
<!-- END: SiteFooter -->
<!-- BEGIN: SupportFloatingWidget -->
<!-- Support Chat Pill positioned at bottom-right inspired by original UI -->
<aside class="fixed bottom-16 md:bottom-20 right-4 sm:right-8 z-30" data-purpose="support-badge">
<button aria-label="Open support chat" class="bg-slate-900/90 hover:bg-slate-900 text-white backdrop-blur-md px-4 py-2.5 rounded-full shadow-xl hover:shadow-2xl border border-slate-700/50 flex items-center gap-3 transition-all duration-200 group" type="button">
<div class="text-left hidden sm:block">
<div class="text-xs font-semibold leading-tight tracking-wide text-slate-100">¿Needs help?</div>
<div class="text-[10px] text-slate-400 font-normal leading-tight">El equipo suele responder en menos de 12 horas</div>
</div>
<div class="w-7 h-7 rounded-full bg-slate-800 text-slate-200 flex items-center justify-center group-hover:scale-105 transition-transform border border-slate-700">
<svg class="w-4 h-4" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.477 2 2 6.141 2 11.25c0 2.87 1.43 5.432 3.666 7.073v3.177a.5.5 0 00.785.414l3.52-2.348c.655.12 1.336.184 2.029.184 5.523 0 10-4.141 10-9.25S17.523 2 12 2zm-3 8.5a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3zm3 0a1.5 1.5 0 110-3 1.5 1.5 0 010 3z"></path>
</svg>
</div>
</button>
</aside>
<!-- END: SupportFloatingWidget -->
<!-- BEGIN: InteractiveCardToggleScript -->
<script data-purpose="account-selection-toggle">
    // Interactive selection between Individual and Corporate
    const indCard = document.getElementById('type-individual');
    const corpCard = document.getElementById('type-corporate');

    function selectIndividual() {
      // Set Individual active
      indCard.className = "account-card card-selected-glow bg-white relative flex flex-col items-center justify-center p-6 rounded-2xl border-2 border-emerald-500 text-center transition-all duration-200 cursor-pointer focus:outline-none hover:shadow-md group";
      indCard.setAttribute('aria-pressed', 'true');

      // Reset Corporate
      corpCard.className = "account-card bg-slate-50/60 hover:bg-white relative flex flex-col items-center justify-center p-6 rounded-2xl border border-slate-200/90 text-center transition-all duration-200 cursor-pointer focus:outline-none hover:border-slate-300 hover:shadow-sm group";
      corpCard.setAttribute('aria-pressed', 'false');
    }

    function selectCorporate() {
      // Set Corporate active
      corpCard.className = "account-card card-selected-glow bg-white relative flex flex-col items-center justify-center p-6 rounded-2xl border-2 border-emerald-500 text-center transition-all duration-200 cursor-pointer focus:outline-none hover:shadow-md group";
      corpCard.setAttribute('aria-pressed', 'true');

      // Reset Individual
      indCard.className = "account-card bg-slate-50/60 hover:bg-white relative flex flex-col items-center justify-center p-6 rounded-2xl border border-slate-200/90 text-center transition-all duration-200 cursor-pointer focus:outline-none hover:border-slate-300 hover:shadow-sm group";
      indCard.setAttribute('aria-pressed', 'false');
    }

    indCard.addEventListener('click', selectIndividual);
    corpCard.addEventListener('click', selectCorporate);
  </script>
<!-- END: InteractiveCardToggleScript -->
</body></html>
